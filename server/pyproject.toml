[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forager"
version = "0.1.0"
description = "自托管媒体采集与归档服务：按 Web 端要求抓取、下载、归档"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "selectolax>=0.3.21,<0.4",
  "cryptography>=43,<46",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
forager = "forager.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["forager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
